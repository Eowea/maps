<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes en 3D</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: rgba(12, 17, 27, .92);
    --border: #2a3348;
    --text: #e8ecf4;
    --dim: #8a94a8;
    --gold: #f5c451;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; display: block; }

  .barre { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .barre > * { pointer-events: auto; }
  .barre select, .barre button, .barre label {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .barre label { display: flex; align-items: center; gap: 8px; cursor: default; }
  .barre input[type=range] { width: 110px; }
  .barre button.actif { border-color: var(--gold); color: var(--gold); }
  .titre { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; color: var(--gold); margin-right: 6px; }

  /* Points d'intérêt : même pastille que sur le site, posée au sommet d'une tige 3D. */
  #marqueurs { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .m {
    position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; background: var(--c); color: #0b0f17; display: grid; place-items: center;
    box-shadow: 0 0 0 3px rgba(8, 12, 20, .92), 0 0 12px var(--c);
    pointer-events: auto; cursor: pointer; transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  .m svg { width: 58%; height: 58%; }
  .m:hover { box-shadow: 0 0 0 3px #f4f6fb, 0 0 16px var(--c); }
  .m.cache { opacity: 0; pointer-events: none; }

  .info {
    position: fixed; z-index: 6; width: 320px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; pointer-events: none; display: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
  .info b { display: block; color: var(--c, var(--gold)); margin-bottom: 4px; font-size: 14px; }
  .info .type { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 2px; }
  .info img { display: block; width: 100%; margin-top: 8px; border-radius: 4px; }

  .legende { position: fixed; left: 12px; bottom: 34px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; }
  .legende button {
    display: flex; align-items: center; gap: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px 4px 6px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .legende button i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(8, 12, 20, .9); }
  .legende button.eteint { opacity: .4; }
  .aide { position: fixed; left: 12px; bottom: 10px; z-index: 5; font-size: 12px; color: var(--dim); }
  .chargement { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); z-index: 4; pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="marqueurs"></div>
<div class="info" id="info"></div>
<div class="chargement" id="chargement">Chargement…</div>

<div class="barre">
  <span class="titre">Cartes en 3D</span>
  <select id="choixCarte"></select>
  <button id="vueJeu" class="actif" title="Caméra inclinée, comme en jeu">Vue jeu</button>
  <button id="vueDessus" title="Vue de dessus, comme la minimap">Vue de dessus</button>
  <label title="Hauteur du relief">Relief <input id="relief" type="range" autocomplete="off" min="0" max="10" step="0.5" value="4"></label>
  <button id="decors" class="actif" hidden title="Bâtiments, arbres et rochers extraits du jeu">Décors 3D</button>
</div>
<div class="legende" id="legende"></div>
<div class="aide">Glisser : tourner · Double-clic : centrer · Molette : zoom · Clic droit : déplacer · Survol d'un point : détail</div>

<script src="data.js"></script>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

/* Types de points : mêmes couleurs et symboles que le site (repris de maps.js). */
const TYPES = {"objectif":{"libelle":"Objectif","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(1 -0.5)\"><path d=\"M5 21V4\"/><path d=\"M5 4h12l-3 4 3 4H5\"/></g></svg>","couleur":"#f5c451"},"camp":{"libelle":"Camp de mercenaires","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(0 0.5)\"><path d=\"M14.5 17.5 3 6V3h3l11.5 11.5\"/><path d=\"M13 19l6-6\"/><path d=\"M16 16l4 4\"/><path d=\"M14.5 6.5 18 3h3v3l-3.5 3.5\"/><path d=\"M5 14l4 4\"/><path d=\"M7 17l-3 3\"/></g></svg>","couleur":"#ff9f43"},"batiment":{"libelle":"Bâtiment","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 21V10L5 7V3h3v2h2V3h4v2h2V3h3v4l-2 3v11z\"/><path d=\"M10 21v-4a2 2 0 0 1 4 0v4\"/></svg>","couleur":"#b794f6"},"tour":{"libelle":"Tour de guet","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"2.6\"/></svg>","couleur":"#6ec6ff"},"fontaine":{"libelle":"Fontaine de soins","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(0 0.5)\"><path d=\"M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z\"/></g></svg>","couleur":"#5fd48a"},"autre":{"libelle":"Autre","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(0 0.25)\"><path d=\"M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/></g></svg>","couleur":"#6f9bff"}};
const ORDRE = Object.keys(TYPES);

const cartes = BATTLEGROUNDS.filter(b => b.minimapImage);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── Scène ─────────────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f17);
scene.fog = new THREE.Fog(0x0b0f17, 160, 320);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;   // jamais sous le terrain
controls.minDistance = 5;
controls.maxDistance = 220;
controls.screenSpacePanning = false;

// Les textures du jeu sont pensées pour un éclairage généreux : sans ça, tout paraît terne.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
// Éclairage de la Passe d'Alterac (LightData.xml, Storm_WCAV) : lumière principale chaude
// venue de l'ouest, appoint bleuté de l'est, contre-jour, ambiance froide.
// Axes : x du jeu → x, altitude → y, y du jeu → −z.
const ambiance = new THREE.HemisphereLight(0x9aa4e6, 0x48424f, 3.4);
scene.add(ambiance);
const soleil = new THREE.DirectionalLight(0xf6e2d2, 3.6);
soleil.position.set(-61.7, 76.6, 18.1);
scene.add(soleil);
const appoint = new THREE.DirectionalLight(0x6070a0, 1.0);
appoint.position.set(81.6, 48, -32.1);
scene.add(appoint);
const contreJour = new THREE.DirectionalLight(0xe2e2c6, 0.8);
contreJour.position.set(-50.5, 66, -55.5);
scene.add(contreJour);
// Ombres portées des bâtiments, arbres et falaises : la carte fait 100 × ~85 unités.
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
soleil.castShadow = true;
soleil.shadow.mapSize.set(4096, 4096);
Object.assign(soleil.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 300 });
soleil.shadow.bias = -0.0004;
soleil.shadow.normalBias = 0.03;

const LARGEUR = 100;            // la carte fait 100 unités de large
const SEGMENTS = 320;
let terrain = null, hauteurs = null, hLarg = 0, hHaut = 0, profondeur = 0, relief = 4;
let tiges = null, points = [];
const typesMasques = new Set();

// Relief déduit de l'image : la luminosité floutée sert de carte de hauteur. Ce n'est
// pas le vrai terrain du jeu, mais les chemins, falaises et bâtiments ressortent.
function lireHauteurs(img) {
  hLarg = 256; hHaut = Math.round(256 * img.height / img.width);
  const c = document.createElement('canvas'); c.width = hLarg; c.height = hHaut;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.filter = 'blur(2.5px)';
  ctx.drawImage(img, 0, 0, hLarg, hHaut);
  const d = ctx.getImageData(0, 0, hLarg, hHaut).data;
  hauteurs = new Float32Array(hLarg * hHaut);
  let min = 1, max = 0;
  for (let i = 0; i < hauteurs.length; i++) {
    const l = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
    hauteurs[i] = l; if (l < min) min = l; if (l > max) max = l;
  }
  for (let i = 0; i < hauteurs.length; i++) hauteurs[i] = (hauteurs[i] - min) / (max - min || 1);
}
/* Données extraites du jeu (dossier 3d/<carte>/) : vrai relief, décors et bâtiments.
   Le calage relie les cases du jeu aux pixels de la minimap du site. */
let jeu = null;   // { calage, terrain, dim, largImg, hautImg }
const zonePourPx = (px) => jeu.calage.zones[px < jeu.calage.limitePx ? 0 : 1];
const zonePourY = (y) => jeu.calage.zones.find(z => y >= z.siY[0] && y < z.siY[1]) || jeu.calage.zones[0];
function caseVersPx(x, y) {
  const z = zonePourY(y);
  return { px: z.px0 + (x - z.x0) * z.pxParCase, py: z.py0 - (y - z.y0) * z.pxParCase, k: z.pxParCase };
}
function hauteurJeu(x, y) {
  const [w, h] = jeu.dim;
  const cx = Math.min(w - 1, Math.max(0, x)), cy = Math.min(h - 1, Math.max(0, y));
  const x0 = Math.floor(cx), y0 = Math.floor(cy), x1 = Math.min(w - 1, x0 + 1), y1 = Math.min(h - 1, y0 + 1);
  const fx = cx - x0, fy = cy - y0, T = (a, b) => jeu.terrain[b * w + a];
  return (T(x0, y0) * (1 - fx) + T(x1, y0) * fx) * (1 - fy) + (T(x0, y1) * (1 - fx) + T(x1, y1) * fx) * fy;
}
// Unités du monde 3D par case du jeu, et hauteur du monde pour une altitude du jeu.
const uniteCase = (k) => k * LARGEUR / jeu.largImg;
const altitude = (z, k) => (z - jeu.reference) * uniteCase(k) * (relief / 4);

// u, v entre 0 et 1, v = 0 en haut de l'image.
function hauteur(u, v) {
  if (jeu) {
    const px = u * jeu.largImg, py = v * jeu.hautImg, z = zonePourPx(px);
    const x = z.x0 + (px - z.px0) / z.pxParCase, y = z.y0 - (py - z.py0) / z.pxParCase;
    return altitude(hauteurJeu(x, y), z.pxParCase);
  }
  const x = Math.min(hLarg - 1, Math.max(0, u * (hLarg - 1)));
  const y = Math.min(hHaut - 1, Math.max(0, v * (hHaut - 1)));
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(hLarg - 1, x0 + 1), y1 = Math.min(hHaut - 1, y0 + 1);
  const fx = x - x0, fy = y - y0, H = (xx, yy) => hauteurs[yy * hLarg + xx];
  return ((H(x0, y0) * (1 - fx) + H(x1, y0) * fx) * (1 - fy) + (H(x0, y1) * (1 - fx) + H(x1, y1) * fx) * fy) * relief;
}
// Position 3D d'un point posé en % de la minimap.
const versMonde = (x, y, dessus = 0) =>
  new THREE.Vector3((x / 100 - .5) * LARGEUR, hauteur(x / 100, y / 100) + dessus, (y / 100 - .5) * profondeur);

function appliquerRelief() {
  const pos = terrain.geometry.attributes.position, uv = terrain.geometry.attributes.uv;
  for (let i = 0; i < pos.count; i++) pos.setY(i, hauteur(uv.getX(i), 1 - uv.getY(i)));
  pos.needsUpdate = true;
  terrain.geometry.computeVertexNormals();
  placerTiges();
  placerDecors();
}

/* ── Sol du jeu ────────────────────────────────────────────────────────────
   Le sol mélange les 8 textures du terrain selon les poids de t3TextureMasks
   (sol/poids0.png pour les textures 1-3, poids1 pour 4-6, poids2 pour 7-8). La minimap reste
   affichée hors du terrain jouable. */
const chargeurTex = new THREE.TextureLoader();
const lireTex = (url, opts = {}) => new Promise((res, rej) => chargeurTex.load(url, t => res(Object.assign(t, opts)), undefined, rej));

async function texturerSol(materiau, dossier) {
  let sol;
  try { sol = await fetch(`${dossier}/sol/sol.json`).then(r => r.ok ? r.json() : null); } catch { sol = null; }
  if (!sol) return;
  const n = sol.textures.length;
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const [poids, textures] = await Promise.all([
    Promise.all([0, 1, 2].map(k => lireTex(`${dossier}/sol/poids${k}.png`, { flipY: false }))),
    Promise.all(sol.textures.map((_, i) => lireTex(`${dossier}/sol/tex${i + 1}.jpg`, {
      colorSpace: THREE.SRGBColorSpace, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, anisotropy: aniso,
    }))),
  ]);
  poids.forEach(t => { t.flipY = false; t.needsUpdate = true; });
  const z = jeu.calage.zones, z1 = z[1] || z[0];
  const uniforms = {
    uPoids0: { value: poids[0] }, uPoids1: { value: poids[1] }, uPoids2: { value: poids[2] },
    uImg: { value: new THREE.Vector2(jeu.largImg, jeu.hautImg) },
    uCases: { value: new THREE.Vector2(...sol.cases) },
    uTuile: { value: new THREE.Vector4(...sol.tuilage) },
    uZone0: { value: new THREE.Vector4(z[0].px0, z[0].py0, z[0].x0, z[0].y0) }, uK0: { value: z[0].pxParCase },
    uZone1: { value: new THREE.Vector4(z1.px0, z1.py0, z1.x0, z1.y0) }, uK1: { value: z1.pxParCase },
    uLimite: { value: jeu.calage.limitePx ?? 1e9 },
  };
  // Gains mesurés sur la minimap (sol.json), en sRGB. Leur médiane, c'est l'éclairage du jeu,
  // que la scène fournit déjà (et qui vaut aussi pour les modèles) : on ne garde que la
  // teinte propre à chaque texture (la glace bien plus cyan, par exemple).
  // Une deuxième zone (la mine de Mine hantée) a ses propres gains, bien plus sombres : le
  // jeu l'éclaire autrement. Rapportés à la médiane de la surface, ils l'assombrissent.
  const gains = sol.gains || [];
  const gainsSecond = sol.gainsZones?.[1] || gains;
  const med = (liste) => [0, 1, 2].map(c => { const v = liste.map(g => g[c]).sort((a, b) => a - b); return v.length ? v[v.length >> 1] : 1; });
  const mediane = med(gains);
  // Teinte des décors de chaque zone (la mine : environ un tiers de la lumière, froide).
  jeu.teintes = (sol.gainsZones || [gains]).map(gz => new THREE.Color(...med(gz).map((g, c) => Math.pow(g / mediane[c], 2.2))));
  textures.forEach((t, i) => {
    uniforms['uTex' + i] = { value: t };
    uniforms['uGain' + i] = { value: new THREE.Vector3(...(gains[i] || mediane).map((g, c) => Math.pow(g / mediane[c], 2.2))) };
    uniforms['uGainB' + i] = { value: new THREE.Vector3(...(gainsSecond[i] || mediane).map((g, c) => Math.pow(g / mediane[c], 2.2))) };
  });
  const echantillons = textures.map((_, i) =>
    `col += ${'p0.r p0.g p0.b p1.r p1.g p1.b p2.r p2.g'.split(' ')[i]} * (z0 ? uGain${i} : uGainB${i}) * texture2D(uTex${i}, tuv).rgb;`).join('\n      ');
  materiau.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, uniforms);
    sh.fragmentShader = `uniform sampler2D uPoids0, uPoids1, uPoids2, ${textures.map((_, i) => 'uTex' + i).join(', ')};
uniform vec3 ${textures.map((_, i) => 'uGain' + i + ', uGainB' + i).join(', ')};
uniform vec2 uImg, uCases; uniform vec4 uTuile, uZone0, uZone1; uniform float uK0, uK1, uLimite;
` + sh.fragmentShader.replace('#include <map_fragment>', `
    {
      vec2 px = vec2(vMapUv.x * uImg.x, (1.0 - vMapUv.y) * uImg.y);
      bool z0 = px.x < uLimite;
      vec4 zn = z0 ? uZone0 : uZone1; float k = z0 ? uK0 : uK1;
      vec2 c = vec2(zn.z + (px.x - zn.x) / k, zn.w - (px.y - zn.y) / k);
      vec4 mini = texture2D(map, vMapUv);
      if (c.x >= 0.0 && c.y >= 0.0 && c.x <= uCases.x && c.y <= uCases.y) {
        vec2 m = c / uCases;
        vec3 p0 = texture2D(uPoids0, m).rgb, p1 = texture2D(uPoids1, m).rgb, p2 = texture2D(uPoids2, m).rgb;
        vec2 tuv = m * uTuile.xy + uTuile.zw;
        vec3 col = vec3(0.0);
      ${echantillons}
        diffuseColor.rgb *= col / max(dot(p0 + p1 + p2, vec3(1.0)), 1e-3);
      } else {
        diffuseColor *= mini;
      }
    }`);
  };
  materiau.customProgramCacheKey = () => 'sol' + n;
}

/* ── Décors et bâtiments du jeu ────────────────────────────────────────────
   Un InstancedMesh par maillage de modèle : 1 750 objets en une centaine d'appels de
   dessin au lieu de plusieurs milliers. */
const decors = new THREE.Group();
scene.add(decors);
let instancesJeu = [];        // [{ maillages: [{mesh, local}], liste: [[x,y,z,rot,s,pitch,roll]] }]
// Modèles compressés par gltfpack (quantification + meshopt) : 4 fois plus légers.
const chargeur = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
// Une texture sert à des dizaines de modèles : sans cache, chacun la retélécharge.
THREE.Cache.enabled = true;
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s3 = new THREE.Vector3(), p3 = new THREE.Vector3();

async function chargerDecors(dossier, scene3d) {
  baseModeles = new URL(`${dossier}/models/`, location.href).href;
  const parModele = scene3d.modeles.map(() => []);
  for (const inst of scene3d.instances) parModele[inst[0]].push(inst.slice(1));
  const sansMaillage = new Set(scene3d.sansMaillage || []);
  const animes = new Set(scene3d.animes || []);
  melangeurs = [];
  instancesJeu = [];
  await Promise.all(scene3d.modeles.map((nom, k) => new Promise(res => {
    if (!parModele[k].length) return res();
    const emetteurs = scene3d.emetteurs?.[k] || [];
    // Modèle fait uniquement de particules (rayons de soleil, braseros) : pas de fichier.
    if (sansMaillage.has(k)) { instancesJeu.push({ nom, maillages: [], liste: parModele[k], emetteurs }); return res(); }
    chargeur.load(`${dossier}/models/${nom}.glb?v=${scene3d.version || 0}`, (g) => {
      if (animes.has(k)) { instancesJeu.push({ nom, ...creerAnimes(g, parModele[k], emetteurs) }); return res(); }
      g.scene.updateMatrixWorld(true);
      const maillages = [];
      g.scene.traverse(o => {
        if (!o.isMesh) return;
        const im = new THREE.InstancedMesh(o.geometry, o.material, parModele[k].length);
        im.frustumCulled = false;
        // Effets (feu, halos, rayons) : additifs ou mélangés, sans ombre ni écriture de
        // profondeur, légèrement avancés pour ne pas scintiller contre le sol.
        preparerMaillage(o, im);
        maillages.push({ mesh: im, local: o.matrixWorld.clone() });
        decors.add(im);
      });
      instancesJeu.push({ nom, maillages, liste: parModele[k], emetteurs });
      res();
    }, undefined, () => res());
  })));
  await chargerTexturesParticules(dossier, scene3d);
  placerDecors();
}

const BLANC = new THREE.Color(1, 1, 1);

// Effets (feu, halos, rayons) : additifs ou mélangés, sans ombre ni écriture de profondeur,
// légèrement avancés pour ne pas scintiller contre le sol. Le reste porte et reçoit l'ombre.
let baseModeles = '';   // adresse du dossier models/ de la carte, pour les masques des effets
function preparerMaillage(o, cible = o) {
  const fx = o.material.userData?.fx;
  if (fx) {
    Object.assign(o.material, { transparent: true, depthWrite: false, polygonOffset: true,
      polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    if (fx === 'add') o.material.blending = THREE.AdditiveBlending;
    // Masque d'opacité (fondu, bords adoucis) : texture à part, sur son propre jeu d'UV.
    const mq = o.material.userData.masque;
    if (mq && !o.material.alphaMap) {
      const t = chargeurTex.load(new URL(mq.uri, baseModeles).href);
      t.flipY = false;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.channel = mq.texCoord || 0;
      o.material.alphaMap = t;
      o.material.needsUpdate = true;
    }
    cible.renderOrder = 1;
  } else {
    cible.castShadow = cible.receiveShadow = true;
  }
}

/* Unités animées (mercenaires, golem, squelettes, villageois) : une copie du modèle par
   instance, avec son squelette, qui joue en boucle l'animation d'attente du jeu. Chaque
   copie démarre à un instant différent pour qu'elles ne bougent pas toutes ensemble. */
let melangeurs = [];
function creerAnimes(g, liste, emetteurs) {
  g.scene.traverse(o => { if (o.isMesh) preparerMaillage(o); });
  const objets = liste.map(() => {
    const copie = SkeletonUtils.clone(g.scene);
    copie.matrixAutoUpdate = false;
    copie.traverse(o => { if (o.isMesh) { o.frustumCulled = false; preparerMaillage(o); } });
    decors.add(copie);
    if (g.animations.length) {
      const m = new THREE.AnimationMixer(copie);
      const a = m.clipAction(g.animations[0]);
      a.play();
      a.time = Math.random() * g.animations[0].duration;
      melangeurs.push(m);
    }
    return copie;
  });
  return { maillages: [], liste, emetteurs, objets };
}
function matriceInstance([x, y, z, rot, s, pitch = 0, roll = 0], cible) {
  const { px, py, k } = caseVersPx(x, y);
  const sol = z > 0.5 ? z : hauteurJeu(x, y);
  p3.set(px / jeu.largImg * LARGEUR - LARGEUR / 2, altitude(sol, k), py / jeu.largImg * LARGEUR - profondeur / 2);
  e.set(pitch, rot, -roll, 'YXZ');
  q.setFromEuler(e);
  const t = uniteCase(k) * s;
  s3.set(t, t, t);
  return cible.compose(p3, q, s3);
}

function couleurInstance(inst) {
  const c = new THREE.Color(1, 1, 1);
  if (jeu.teintes?.length > 1) c.copy(jeu.teintes[jeu.calage.zones.indexOf(zonePourY(inst[1]))] || BLANC);
  if (inst[7] !== undefined) c.multiply(new THREE.Color(inst[7]));
  return c;
}

function placerDecors() {
  if (!jeu) return;
  const plusieursZones = jeu.teintes?.length > 1;
  for (const { maillages, liste, objets } of instancesJeu) {
    // Couleur d'une instance : assombrissement de sa zone (la mine) × teinte de l'objet
    // (TintColor de la carte, 8e valeur). Dès qu'une instance en a une, toutes en reçoivent.
    const colorer = plusieursZones || liste.some(inst => inst[7] !== undefined);
    liste.forEach((inst, i) => {
      matriceInstance(inst, m4);
      const teinte = colorer ? couleurInstance(inst) : null;
      if (objets) {
        objets[i].matrix.copy(m4);
        objets[i].matrixWorldNeedsUpdate = true;
        // Les unités ne prennent que la teinte propre de l'objet, pas l'assombrissement de
        // la mine : le jeu les garde lisibles (leurs textures sont déjà sombres).
        const propre = inst[7] !== undefined ? new THREE.Color(inst[7]) : null;
        if (propre && !objets[i].userData.teinte) {   // une seule fois par copie
          objets[i].userData.teinte = true;
          objets[i].traverse(o => {
            if (o.isMesh && !o.material.userData?.fx) { o.material = o.material.clone(); o.material.color.multiply(propre); }
          });
        }
      }
      for (const { mesh, local } of maillages) {
        mesh.setMatrixAt(i, new THREE.Matrix4().multiplyMatrices(m4, local));
        if (teinte && !mesh.material.userData?.fx) mesh.setColorAt(i, teinte);
      }
    });
    for (const { mesh } of maillages) {
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    }
  }
  construireParticules();
}

/* ── Particules ────────────────────────────────────────────────────────────
   Les émetteurs des modèles (feu des braseros, lucioles, rayons, braises) sont rejoués
   en boucle sur la carte de la GPU : chaque particule a sa graine, sa direction dans le
   cône d'émission et son point de départ dans la zone ; le shader la fait vivre (trajet,
   gravité, taille et couleur début → milieu → fin). Un groupe de points par texture. */
const particules = new THREE.Group();
decors.add(particules);
const texturesParticules = new Map();
const horloge = new THREE.Clock();
const uniformesParticules = { uTemps: { value: 0 }, uEcran: { value: 1 } };

async function chargerTexturesParticules(dossier, scene3d) {
  const noms = new Set(Object.values(scene3d.emetteurs || {}).flat().map(em => em.tex));
  texturesParticules.clear();
  await Promise.all([...noms].map(nom => new Promise(res => chargeurTex.load(`${dossier}/textures/${nom}`, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    texturesParticules.set(nom, t); res();
  }, undefined, () => res()))));
}

const VERTEX_PARTICULES = `
  uniform float uTemps, uEcran;
  attribute vec3 aDir; attribute vec4 aVie;      // graine, durée, vitesse, gravité
  attribute vec3 aTailles; attribute float aMilieu;
  attribute vec4 aC0, aC1, aC2;
  varying vec4 vCouleur;
  void main() {
    float t = fract(uTemps / aVie.y + aVie.x);
    float age = t * aVie.y;
    vec3 p = position + aDir * aVie.z * age + vec3(0.0, 0.5 * aVie.w * age * age, 0.0);
    float m = clamp(aMilieu, 0.05, 0.95);
    float taille = t < m ? mix(aTailles.x, aTailles.y, t / m) : mix(aTailles.y, aTailles.z, (t - m) / (1.0 - m));
    vCouleur = t < m ? mix(aC0, aC1, t / m) : mix(aC1, aC2, (t - m) / (1.0 - m));
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_PointSize = clamp(taille * uEcran / -mv.z, 1.0, 256.0);
    gl_Position = projectionMatrix * mv;
  }`;
const FRAGMENT_PARTICULES = `
  uniform sampler2D uTex; uniform float uAdditif;
  varying vec4 vCouleur;
  void main() {
    vec4 c = texture2D(uTex, gl_PointCoord) * vCouleur;
    if (c.a < 0.003 && uAdditif < 0.5) discard;
    gl_FragColor = uAdditif > 0.5 ? vec4(c.rgb * vCouleur.a, 1.0) : c;
    #include <colorspace_fragment>
  }`;

const ALEA = (() => { let s = 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const vTmp = new THREE.Vector3(), vAxe = new THREE.Vector3(), vPerp = new THREE.Vector3(), qTmp = new THREE.Quaternion();

function construireParticules() {
  if (!particules.parent) decors.add(particules);   // decors.clear() au changement de carte
  for (const p of [...particules.children]) { p.geometry.dispose(); p.material.dispose(); particules.remove(p); }
  const groupes = new Map();
  const mat = new THREE.Matrix4(), rot = new THREE.Matrix3();
  for (const { liste, emetteurs } of instancesJeu) {
    if (!emetteurs?.length) continue;
    for (const inst of liste) {
      matriceInstance(inst, mat);
      const echelle = s3.x;   // unités du monde par unité du modèle
      rot.setFromMatrix4(mat);
      for (const em of emetteurs) {
        const tex = texturesParticules.get(em.tex);
        if (!tex) continue;
        const cle = em.tex + '|' + em.mode;
        if (!groupes.has(cle)) groupes.set(cle, { tex, mode: em.mode, a: { position: [], aDir: [], aVie: [], aTailles: [], aMilieu: [], aC0: [], aC1: [], aC2: [] } });
        const a = groupes.get(cle).a;
        vAxe.fromArray(em.axe).applyMatrix3(rot).normalize();
        for (let n = 0; n < em.nombre; n++) {
          // Départ dans la zone d'émission (0 point, 1 plan, 2 sphère, 3 boîte, 4 cylindre).
          const r = em.rayon, z = em.zoneTaille;
          let ox = 0, oy = 0, oz = 0;
          if (em.zone === 1 || em.zone === 3) { ox = (ALEA() - .5) * z[0]; oz = (ALEA() - .5) * z[1]; oy = em.zone === 3 ? (ALEA() - .5) * z[2] : 0; }
          else if (em.zone === 2) { const u = ALEA() * 2 * Math.PI, v = Math.acos(2 * ALEA() - 1), l = r * Math.cbrt(ALEA()); ox = l * Math.sin(v) * Math.cos(u); oz = l * Math.sin(v) * Math.sin(u); oy = l * Math.cos(v); }
          else if (em.zone === 4) { const u = ALEA() * 2 * Math.PI, l = r * Math.sqrt(ALEA()); ox = l * Math.cos(u); oz = l * Math.sin(u); oy = (ALEA() - .5) * z[2]; }
          vTmp.set(em.pos[0] + ox, em.pos[1] + oy, em.pos[2] + oz).applyMatrix4(mat);
          a.position.push(vTmp.x, vTmp.y, vTmp.z);
          // Direction au hasard dans le cône autour de l'axe de l'os.
          const angle = ALEA() * Math.min(em.cone, Math.PI);
          vPerp.set(1, 0, 0); if (Math.abs(vAxe.x) > .9) vPerp.set(0, 0, 1);
          vPerp.cross(vAxe).normalize();
          qTmp.setFromAxisAngle(vAxe, ALEA() * 2 * Math.PI);
          vPerp.applyQuaternion(qTmp);
          vTmp.copy(vAxe).multiplyScalar(Math.cos(angle)).addScaledVector(vPerp, Math.sin(angle));
          a.aDir.push(vTmp.x, vTmp.y, vTmp.z);
          a.aVie.push(ALEA(), Math.max(em.vie, 0.1), em.vitesse * echelle, em.gravite * echelle);
          a.aTailles.push(...em.tailles.map(t => t * echelle * 2));
          a.aMilieu.push(em.milieu);
          for (const [c, nomC] of [[0, 'aC0'], [1, 'aC1'], [2, 'aC2']]) a[nomC].push(...em.couleurs[c].map(v => v / 255));
        }
      }
    }
  }
  for (const { tex, mode, a } of groupes.values()) {
    const g = new THREE.BufferGeometry();
    const tailles = { position: 3, aDir: 3, aVie: 4, aTailles: 3, aMilieu: 1, aC0: 4, aC1: 4, aC2: 4 };
    for (const [nom, n] of Object.entries(tailles)) g.setAttribute(nom, new THREE.Float32BufferAttribute(a[nom], n));
    const m = new THREE.ShaderMaterial({
      uniforms: { ...uniformesParticules, uTex: { value: tex }, uAdditif: { value: mode === 'add' ? 1 : 0 } },
      vertexShader: VERTEX_PARTICULES, fragmentShader: FRAGMENT_PARTICULES,
      transparent: true, depthWrite: false, blending: mode === 'add' ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    const pts = new THREE.Points(g, m);
    pts.frustumCulled = false;
    pts.renderOrder = 2;
    particules.add(pts);
  }
}

$('decors').onclick = (ev) => {
  decors.visible = !decors.visible;
  ev.currentTarget.classList.toggle('actif', decors.visible);
};

/* ── Points d'intérêt ──────────────────────────────────────────────────── */
const HAUTEUR_TIGE = 5;
function placerTiges() {
  if (tiges) { scene.remove(tiges); tiges.geometry.dispose(); }
  const sommets = [], couleurs = [];
  for (const p of points) {
    if (typesMasques.has(p.cle)) continue;
    const bas = versMonde(p.h.x, p.h.y), haut = versMonde(p.h.x, p.h.y, HAUTEUR_TIGE);
    p.sommet = haut;
    const c = new THREE.Color(TYPES[p.cle].couleur);
    sommets.push(bas.x, bas.y, bas.z, haut.x, haut.y, haut.z);
    couleurs.push(c.r, c.g, c.b, c.r, c.g, c.b);
  }
  for (const p of points) if (!p.sommet || typesMasques.has(p.cle)) p.sommet = versMonde(p.h.x, p.h.y, HAUTEUR_TIGE);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(sommets, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(couleurs, 3));
  tiges = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .85 }));
  scene.add(tiges);
}

function creerMarqueurs(carte) {
  const conteneur = $('marqueurs');
  conteneur.innerHTML = '';
  points = (carte.hotspots || []).map(h => {
    const cle = TYPES[h.type] ? h.type : 'autre';
    const el = document.createElement('div');
    el.className = 'm';
    el.style.setProperty('--c', TYPES[cle].couleur);
    el.innerHTML = TYPES[cle].icone;
    const p = { h, cle, el, sommet: null };
    el.addEventListener('mouseenter', () => montrerInfo(p));
    el.addEventListener('mouseleave', () => { $('info').style.display = 'none'; });
    conteneur.appendChild(el);
    return p;
  });
  const presents = ORDRE.filter(k => points.some(p => p.cle === k));
  $('legende').innerHTML = presents.map(k =>
    `<button data-type="${k}" style="--c:${TYPES[k].couleur}"><i></i>${esc(TYPES[k].libelle)}</button>`).join('');
}

function montrerInfo(p) {
  const i = $('info');
  i.style.setProperty('--c', TYPES[p.cle].couleur);
  i.innerHTML = `<div class="type">${esc(TYPES[p.cle].libelle)}</div><b>${esc(p.h.name?.fr)}</b>${esc(p.h.description?.fr)}`
    + (p.h.image ? `<img src="${esc(p.h.image)}" alt="">` : '');
  i.style.display = 'block';
  const r = p.el.getBoundingClientRect();
  const x = Math.min(innerWidth - 332, Math.max(12, r.left + r.width / 2 - 160));
  const enHaut = r.top > innerHeight / 2;
  i.style.left = x + 'px';
  i.style.top = enHaut ? '' : (r.bottom + 10) + 'px';
  i.style.bottom = enHaut ? (innerHeight - r.top + 10) + 'px' : '';
}

$('legende').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.type;
  typesMasques.has(k) ? typesMasques.delete(k) : typesMasques.add(k);
  b.classList.toggle('eteint', typesMasques.has(k));
  placerTiges();
});

// Les pastilles HTML suivent leur tige : projetées à l'écran à chaque image, et triées
// par distance pour que les plus proches passent devant.
const v = new THREE.Vector3();
function placerMarqueurs() {
  for (const p of points) {
    const masque = typesMasques.has(p.cle);
    v.copy(p.sommet).project(camera);
    const hors = v.z > 1 || Math.abs(v.x) > 1.2 || Math.abs(v.y) > 1.2;
    p.el.classList.toggle('cache', masque || hors);
    if (hors) continue;
    const d = camera.position.distanceTo(p.sommet);
    const echelle = Math.max(.6, Math.min(1.3, 70 / d));
    p.el.style.transform = `translate(${(v.x + 1) / 2 * innerWidth}px, ${(1 - v.y) / 2 * innerHeight}px) scale(${echelle})`;
    p.el.style.zIndex = String(1000 - Math.round(d));
  }
}

/* ── Caméras ───────────────────────────────────────────────────────────── */
function vue(type) {
  $('vueJeu').classList.toggle('actif', type === 'jeu');
  $('vueDessus').classList.toggle('actif', type === 'dessus');
  controls.target.set(0, 0, type === 'jeu' ? 4 : 0);
  if (type === 'jeu') camera.position.set(0, 62, 50);       // inclinaison proche de la caméra du jeu
  else camera.position.set(0, 125, 0.01);
  controls.update();
}
$('vueJeu').onclick = () => vue('jeu');
// Double-clic : recentre la caméra sur le point visé du sol, en gardant l'angle de vue.
const rayon = new THREE.Raycaster(), souris = new THREE.Vector2();
renderer.domElement.addEventListener('dblclick', (ev) => {
  if (!terrain) return;
  const r = renderer.domElement.getBoundingClientRect();
  souris.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  rayon.setFromCamera(souris, camera);
  const touche = rayon.intersectObject(terrain)[0];
  if (!touche) return;
  const decalage = touche.point.clone().sub(controls.target);
  controls.target.add(decalage);
  camera.position.add(decalage);
  controls.update();
});
$('vueDessus').onclick = () => vue('dessus');
$('relief').oninput = (e) => { relief = Number(e.target.value); if (terrain) appliquerRelief(); };
$('relief').value = relief;   // le navigateur peut restaurer une ancienne valeur du curseur

/* ── Chargement d'une carte ────────────────────────────────────────────── */
async function charger(id) {
  const carte = cartes.find(c => c.id === id) || cartes[0];
  $('chargement').style.display = 'grid';
  history.replaceState(null, '', '#' + carte.id);
  const img = new Image();
  img.src = carte.minimapImage;
  await img.decode();
  lireHauteurs(img);
  profondeur = LARGEUR * img.height / img.width;

  // Données extraites du jeu, si cette carte en a.
  decors.clear();
  instancesJeu = [];
  jeu = null;
  const dossier = `3d/${carte.id}`;
  let scene3d = null;
  try {
    const [calage, sc, bin] = await Promise.all([
      fetch(`${dossier}/calage.json`).then(r => r.ok ? r.json() : null),
      fetch(`${dossier}/scene.json`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null),
      fetch(`${dossier}/terrain.bin`).then(r => r.ok ? r.arrayBuffer() : null),
    ]);
    if (calage && sc && bin) {
      jeu = { calage, terrain: new Float32Array(bin), dim: sc.dim, largImg: img.width, hautImg: img.height,
              reference: sc.hauteurReference ?? calage.hauteurReference };
      scene3d = sc;
    }
  } catch { jeu = null; }
  $('decors').hidden = !jeu;

  const tex = new THREE.Texture(img);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;
  if (terrain) { scene.remove(terrain); terrain.geometry.dispose(); terrain.material.map?.dispose(); terrain.material.dispose(); }
  const geo = new THREE.PlaneGeometry(LARGEUR, profondeur, SEGMENTS, Math.round(SEGMENTS * profondeur / LARGEUR));
  geo.rotateX(-Math.PI / 2);
  const materiau = new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 });
  if (jeu) await texturerSol(materiau, dossier);
  terrain = new THREE.Mesh(geo, materiau);
  terrain.receiveShadow = true;
  scene.add(terrain);

  creerMarqueurs(carte);
  appliquerRelief();
  if (scene3d) {
    $('chargement').textContent = 'Chargement des décors…';
    await chargerDecors(dossier, scene3d);
  }
  $('chargement').style.display = 'none';
  $('chargement').textContent = 'Chargement…';
}

$('choixCarte').innerHTML = cartes.map(c => `<option value="${c.id}">${esc(c.name.fr)}</option>`).join('');
$('choixCarte').onchange = (e) => charger(e.target.value);
const depart = decodeURIComponent(location.hash.slice(1)) || 'passe-alterac';
$('choixCarte').value = cartes.some(c => c.id === depart) ? depart : cartes[0].id;

function redimensionner() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  // Taille des particules : pixels par unité du monde à distance 1.
  uniformesParticules.uEcran.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', redimensionner);
redimensionner();
vue('jeu');
charger($('choixCarte').value);

// Débogage : ?debug dans l'adresse expose la scène à la console.
if (new URLSearchParams(location.search).has('debug')) window.carte3d = { THREE, scene, camera, controls, decors, get instances() { return instancesJeu; }, get jeu() { return jeu; }, hauteurJeu, caseVersPx, altitude };

renderer.setAnimationLoop(() => {
  controls.update();
  const dt = horloge.getDelta();
  uniformesParticules.uTemps.value = horloge.elapsedTime;
  for (const m of melangeurs) m.update(dt);
  renderer.render(scene, camera);
  if (points.length && points[0].sommet) placerMarqueurs();
});
</script>
