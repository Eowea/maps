<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes en 3D</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: rgba(12, 17, 27, .92);
    --border: #2a3348;
    --text: #e8ecf4;
    --dim: #8a94a8;
    --gold: #f5c451;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; display: block; }

  .barre { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .barre > * { pointer-events: auto; }
  .barre select, .barre button, .barre label {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .barre label { display: flex; align-items: center; gap: 8px; cursor: default; }
  .barre input[type=range] { width: 110px; }
  .barre button.actif { border-color: var(--gold); color: var(--gold); }
  .titre { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; color: var(--gold); margin-right: 6px; }

  /* Points d'intérêt : même pastille que sur le site, posée au sommet d'une tige 3D. */
  #marqueurs { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .m {
    position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; background: var(--c); color: #0b0f17; display: grid; place-items: center;
    box-shadow: 0 0 0 3px rgba(8, 12, 20, .92), 0 0 12px var(--c);
    pointer-events: auto; cursor: pointer; transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  .m svg { width: 58%; height: 58%; }
  .m:hover { box-shadow: 0 0 0 3px #f4f6fb, 0 0 16px var(--c); }
  .m.cache { opacity: 0; pointer-events: none; }

  .info {
    position: fixed; z-index: 6; width: 320px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; pointer-events: none; display: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
  .info b { display: block; color: var(--c, var(--gold)); margin-bottom: 4px; font-size: 14px; }
  .info .type { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 2px; }
  .info img { display: block; width: 100%; margin-top: 8px; border-radius: 4px; }

  .legende { position: fixed; left: 12px; bottom: 34px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; }
  .legende button {
    display: flex; align-items: center; gap: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px 4px 6px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .legende button i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(8, 12, 20, .9); }
  .legende button.eteint { opacity: .4; }
  .aide { position: fixed; left: 12px; bottom: 10px; z-index: 5; font-size: 12px; color: var(--dim); }
  .chargement { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); z-index: 4; pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="marqueurs"></div>
<div class="info" id="info"></div>
<div class="chargement" id="chargement">Chargement…</div>

<div class="barre">
  <span class="titre">Cartes en 3D</span>
  <select id="choixCarte"></select>
  <button id="vueJeu" class="actif" title="Caméra inclinée, comme en jeu">Vue jeu</button>
  <button id="vueDessus" title="Vue de dessus, comme la minimap">Vue de dessus</button>
  <label title="Hauteur du relief déduit de l'image">Relief <input id="relief" type="range" min="0" max="10" step="0.5" value="4"></label>
</div>
<div class="legende" id="legende"></div>
<div class="aide">Glisser : tourner · Molette : zoom · Clic droit : déplacer · Survol d'un point : détail</div>

<script src="data.js"></script>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Types de points : mêmes couleurs et symboles que le site (repris de maps.js). */
const TYPES = {"objectif":{"libelle":"Objectif","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(1 -0.5)\"><path d=\"M5 21V4\"/><path d=\"M5 4h12l-3 4 3 4H5\"/></g></svg>","couleur":"#f5c451"},"camp":{"libelle":"Camp de mercenaires","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(0 0.5)\"><path d=\"M14.5 17.5 3 6V3h3l11.5 11.5\"/><path d=\"M13 19l6-6\"/><path d=\"M16 16l4 4\"/><path d=\"M14.5 6.5 18 3h3v3l-3.5 3.5\"/><path d=\"M5 14l4 4\"/><path d=\"M7 17l-3 3\"/></g></svg>","couleur":"#ff9f43"},"batiment":{"libelle":"Bâtiment","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 21V10L5 7V3h3v2h2V3h4v2h2V3h3v4l-2 3v11z\"/><path d=\"M10 21v-4a2 2 0 0 1 4 0v4\"/></svg>","couleur":"#b794f6"},"tour":{"libelle":"Tour de guet","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"2.6\"/></svg>","couleur":"#6ec6ff"},"fontaine":{"libelle":"Fontaine de soins","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(0 0.5)\"><path d=\"M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z\"/></g></svg>","couleur":"#5fd48a"},"autre":{"libelle":"Autre","icone":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><g transform=\"translate(0 0.25)\"><path d=\"M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/></g></svg>","couleur":"#6f9bff"}};
const ORDRE = Object.keys(TYPES);

const cartes = BATTLEGROUNDS.filter(b => b.minimapImage);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── Scène ─────────────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f17);
scene.fog = new THREE.Fog(0x0b0f17, 160, 320);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;   // jamais sous le terrain
controls.minDistance = 15;
controls.maxDistance = 220;
controls.screenSpacePanning = false;

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2018, 1.1));
const soleil = new THREE.DirectionalLight(0xfff1dd, 1.6);
soleil.position.set(-60, 90, 40);
scene.add(soleil);

const LARGEUR = 100;            // la carte fait 100 unités de large
const SEGMENTS = 320;
let terrain = null, hauteurs = null, hLarg = 0, hHaut = 0, profondeur = 0, relief = 4;
let tiges = null, points = [];
const typesMasques = new Set();

// Relief déduit de l'image : la luminosité floutée sert de carte de hauteur. Ce n'est
// pas le vrai terrain du jeu, mais les chemins, falaises et bâtiments ressortent.
function lireHauteurs(img) {
  hLarg = 256; hHaut = Math.round(256 * img.height / img.width);
  const c = document.createElement('canvas'); c.width = hLarg; c.height = hHaut;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.filter = 'blur(2.5px)';
  ctx.drawImage(img, 0, 0, hLarg, hHaut);
  const d = ctx.getImageData(0, 0, hLarg, hHaut).data;
  hauteurs = new Float32Array(hLarg * hHaut);
  let min = 1, max = 0;
  for (let i = 0; i < hauteurs.length; i++) {
    const l = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
    hauteurs[i] = l; if (l < min) min = l; if (l > max) max = l;
  }
  for (let i = 0; i < hauteurs.length; i++) hauteurs[i] = (hauteurs[i] - min) / (max - min || 1);
}
// u, v entre 0 et 1, v = 0 en haut de l'image.
function hauteur(u, v) {
  const x = Math.min(hLarg - 1, Math.max(0, u * (hLarg - 1)));
  const y = Math.min(hHaut - 1, Math.max(0, v * (hHaut - 1)));
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(hLarg - 1, x0 + 1), y1 = Math.min(hHaut - 1, y0 + 1);
  const fx = x - x0, fy = y - y0, H = (xx, yy) => hauteurs[yy * hLarg + xx];
  return ((H(x0, y0) * (1 - fx) + H(x1, y0) * fx) * (1 - fy) + (H(x0, y1) * (1 - fx) + H(x1, y1) * fx) * fy) * relief;
}
// Position 3D d'un point posé en % de la minimap.
const versMonde = (x, y, dessus = 0) =>
  new THREE.Vector3((x / 100 - .5) * LARGEUR, hauteur(x / 100, y / 100) + dessus, (y / 100 - .5) * profondeur);

function appliquerRelief() {
  const pos = terrain.geometry.attributes.position, uv = terrain.geometry.attributes.uv;
  for (let i = 0; i < pos.count; i++) pos.setY(i, hauteur(uv.getX(i), 1 - uv.getY(i)));
  pos.needsUpdate = true;
  terrain.geometry.computeVertexNormals();
  placerTiges();
}

/* ── Points d'intérêt ──────────────────────────────────────────────────── */
const HAUTEUR_TIGE = 5;
function placerTiges() {
  if (tiges) { scene.remove(tiges); tiges.geometry.dispose(); }
  const sommets = [], couleurs = [];
  for (const p of points) {
    if (typesMasques.has(p.cle)) continue;
    const bas = versMonde(p.h.x, p.h.y), haut = versMonde(p.h.x, p.h.y, HAUTEUR_TIGE);
    p.sommet = haut;
    const c = new THREE.Color(TYPES[p.cle].couleur);
    sommets.push(bas.x, bas.y, bas.z, haut.x, haut.y, haut.z);
    couleurs.push(c.r, c.g, c.b, c.r, c.g, c.b);
  }
  for (const p of points) if (!p.sommet || typesMasques.has(p.cle)) p.sommet = versMonde(p.h.x, p.h.y, HAUTEUR_TIGE);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(sommets, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(couleurs, 3));
  tiges = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .85 }));
  scene.add(tiges);
}

function creerMarqueurs(carte) {
  const conteneur = $('marqueurs');
  conteneur.innerHTML = '';
  points = (carte.hotspots || []).map(h => {
    const cle = TYPES[h.type] ? h.type : 'autre';
    const el = document.createElement('div');
    el.className = 'm';
    el.style.setProperty('--c', TYPES[cle].couleur);
    el.innerHTML = TYPES[cle].icone;
    const p = { h, cle, el, sommet: null };
    el.addEventListener('mouseenter', () => montrerInfo(p));
    el.addEventListener('mouseleave', () => { $('info').style.display = 'none'; });
    conteneur.appendChild(el);
    return p;
  });
  const presents = ORDRE.filter(k => points.some(p => p.cle === k));
  $('legende').innerHTML = presents.map(k =>
    `<button data-type="${k}" style="--c:${TYPES[k].couleur}"><i></i>${esc(TYPES[k].libelle)}</button>`).join('');
}

function montrerInfo(p) {
  const i = $('info');
  i.style.setProperty('--c', TYPES[p.cle].couleur);
  i.innerHTML = `<div class="type">${esc(TYPES[p.cle].libelle)}</div><b>${esc(p.h.name?.fr)}</b>${esc(p.h.description?.fr)}`
    + (p.h.image ? `<img src="${esc(p.h.image)}" alt="">` : '');
  i.style.display = 'block';
  const r = p.el.getBoundingClientRect();
  const x = Math.min(innerWidth - 332, Math.max(12, r.left + r.width / 2 - 160));
  const enHaut = r.top > innerHeight / 2;
  i.style.left = x + 'px';
  i.style.top = enHaut ? '' : (r.bottom + 10) + 'px';
  i.style.bottom = enHaut ? (innerHeight - r.top + 10) + 'px' : '';
}

$('legende').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.type;
  typesMasques.has(k) ? typesMasques.delete(k) : typesMasques.add(k);
  b.classList.toggle('eteint', typesMasques.has(k));
  placerTiges();
});

// Les pastilles HTML suivent leur tige : projetées à l'écran à chaque image, et triées
// par distance pour que les plus proches passent devant.
const v = new THREE.Vector3();
function placerMarqueurs() {
  for (const p of points) {
    const masque = typesMasques.has(p.cle);
    v.copy(p.sommet).project(camera);
    const hors = v.z > 1 || Math.abs(v.x) > 1.2 || Math.abs(v.y) > 1.2;
    p.el.classList.toggle('cache', masque || hors);
    if (hors) continue;
    const d = camera.position.distanceTo(p.sommet);
    const echelle = Math.max(.6, Math.min(1.3, 70 / d));
    p.el.style.transform = `translate(${(v.x + 1) / 2 * innerWidth}px, ${(1 - v.y) / 2 * innerHeight}px) scale(${echelle})`;
    p.el.style.zIndex = String(1000 - Math.round(d));
  }
}

/* ── Caméras ───────────────────────────────────────────────────────────── */
function vue(type) {
  $('vueJeu').classList.toggle('actif', type === 'jeu');
  $('vueDessus').classList.toggle('actif', type === 'dessus');
  controls.target.set(0, 0, type === 'jeu' ? 4 : 0);
  if (type === 'jeu') camera.position.set(0, 62, 50);       // inclinaison proche de la caméra du jeu
  else camera.position.set(0, 125, 0.01);
  controls.update();
}
$('vueJeu').onclick = () => vue('jeu');
$('vueDessus').onclick = () => vue('dessus');
$('relief').oninput = (e) => { relief = Number(e.target.value); if (terrain) appliquerRelief(); };

/* ── Chargement d'une carte ────────────────────────────────────────────── */
async function charger(id) {
  const carte = cartes.find(c => c.id === id) || cartes[0];
  $('chargement').style.display = 'grid';
  history.replaceState(null, '', '#' + carte.id);
  const img = new Image();
  img.src = carte.minimapImage;
  await img.decode();
  lireHauteurs(img);
  profondeur = LARGEUR * img.height / img.width;

  const tex = new THREE.Texture(img);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;
  if (terrain) { scene.remove(terrain); terrain.geometry.dispose(); terrain.material.map?.dispose(); terrain.material.dispose(); }
  const geo = new THREE.PlaneGeometry(LARGEUR, profondeur, SEGMENTS, Math.round(SEGMENTS * profondeur / LARGEUR));
  geo.rotateX(-Math.PI / 2);
  terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 }));
  scene.add(terrain);

  creerMarqueurs(carte);
  appliquerRelief();
  $('chargement').style.display = 'none';
}

$('choixCarte').innerHTML = cartes.map(c => `<option value="${c.id}">${esc(c.name.fr)}</option>`).join('');
$('choixCarte').onchange = (e) => charger(e.target.value);
const depart = decodeURIComponent(location.hash.slice(1)) || 'passe-alterac';
$('choixCarte').value = cartes.some(c => c.id === depart) ? depart : cartes[0].id;

function redimensionner() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', redimensionner);
redimensionner();
vue('jeu');
charger($('choixCarte').value);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  if (points.length && points[0].sommet) placerMarqueurs();
});
</script>
</body>
</html>
